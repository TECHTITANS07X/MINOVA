# MINOVA Infrastructure - Docker Compose (reference / future use)
# Currently running native services via native-services.ps1
# This file documents the intended container architecture.

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: minova-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: minova
      POSTGRES_USER: minova_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-minova_dev_2026}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U minova_admin -d minova"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: minova-keycloak
    command: start-dev --import-realm
    ports:
      - "8081:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: minova_admin
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:-minova_dev_2026}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_PORT: "8080"
    volumes:
      - ./keycloak/minova-realm.json:/opt/keycloak/data/import/minova-realm.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15

  minio:
    image: minio/minio:latest
    container_name: minova-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minova_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minova_minio_2026}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:latest
    container_name: minova-temporal
    ports:
      - "7233:7233"
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_SEEDS: postgres
      POSTGRES_USER: minova_admin
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-minova_dev_2026}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--namespace", "default"]
      interval: 10s
      timeout: 5s
      retries: 15

  temporal-ui:
    image: temporalio/ui:latest
    container_name: minova-temporal-ui
    ports:
      - "8233:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    depends_on:
      - temporal

volumes:
  pgdata:
  miniodata:
